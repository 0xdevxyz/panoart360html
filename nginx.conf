# Die Blog-Slugs weichen von den Dateinamen ab (/blog/dsgvo-2025-.../ liegt
# als blog-dsgvo-2024.html). Ohne diese Zuordnung laufen alle Canonicals
# und Sitemap-Eintraege der Artikel in einen 404.
map_hash_bucket_size 256;

map $uri $blog_datei {
        default "";
        "/blog/16-gruende-warum-besucher-ihre-website-verlassen/"  /blog-website-absprung.html;
        "/blog/chatgpt-openai-unternehmen-dos-donts/"  /blog-ki-chatgpt-dos-donts.html;
        "/blog/content-marketing-kmu-strategie/"  /blog-content-marketing-kmu.html;
        "/blog/conversion-rate-optimierung/"  /blog-conversion-rate-optimierung.html;
        "/blog/core-web-vitals-2026-google-ranking/"  /blog-core-web-vitals-2026.html;
        "/blog/dsgvo-2025-was-unternehmen-jetzt-wissen-muessen/"  /blog-dsgvo-2024.html;
        "/blog/dsgvo-ki-tools-unternehmen-2026/"  /blog-dsgvo-ai-tools-2026.html;
        "/blog/email-marketing-newsletter-2026/"  /blog-email-marketing-2026.html;
        "/blog/google-ads-kmu-2026/"  /blog-google-ads-kmu-2026.html;
        "/blog/google-my-business-optimieren/"  /blog-google-my-business-optimieren.html;
        "/blog/google-search-console-guide-einsteiger/"  /blog-google-search-console-guide.html;
        "/blog/ki-bildgenerierung-unternehmen-praxistest/"  /blog-ki-bildgenerierung-unternehmen.html;
        "/blog/ki-texte-seo-2026/"  /blog-ki-seo-2026.html;
        "/blog/lokales-seo-limbach-oberfrohna/"  /blog-local-seo-limbach-oberfrohna.html;
        "/blog/mehr-google-bewertungen-strategien/"  /blog-google-bewertungen-mehr.html;
        "/blog/onpage-seo-checkliste-2026/"  /blog-onpage-seo-checkliste.html;
        "/blog/social-media-kmu-2026/"  /blog-social-media-kmu-2026.html;
        "/blog/website-barrierefreiheit-bfsg-2026/"  /blog-website-barrierefreiheit-2026.html;
        "/blog/website-kosten-2026/"  /blog-website-kosten-2026.html;
        "/blog/website-performance-optimieren-schneller-laden/"  /blog-website-performance.html;
        "/blog/website-relaunch-planung-checkliste/"  /blog-website-relaunch-planung.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy mail.php -> Node.js mail server
    location = /mail.php {
        proxy_pass http://localhost:3000;
        proxy_set_header Content-Type $content_type;
        # Ohne diese Header sieht mail.js jede Anfrage als dieselbe IP
        # und das Rate-Limit sperrt entweder alle oder niemanden.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Das Docroot ist zugleich der Docker-Build-Kontext. Alles, was hier liegt,
    # aber nicht zur Website gehoert, war bisher oeffentlich abrufbar –
    # darunter mail.js mit den SMTP-Zugangsdaten und das komplette .git.
    location ~ /\.git { deny all; return 404; }
    location ~ ^/(mail\.js|package\.json|package-lock\.json|Dockerfile|nginx\.conf)$ { deny all; return 404; }
    location ~ \.(bak|neu|orig|save|swp|tar|tar\.gz|zip|sql)$ { deny all; return 404; }
    location ~ /\.(env|ht) { deny all; return 404; }

    # Sprechende URLs: /webdesign-chemnitz liefert webdesign-chemnitz.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Die AGB liegen als agb.html, das Canonical nennt sie aber
    # /allgemeine-geschaeftsbedingung — einziger Pfad ausserhalb des Blogs,
    # bei dem Dateiname und URL auseinanderlaufen.
    location = /allgemeine-geschaeftsbedingung {
        try_files /agb.html =404;
    }

    location /blog/ {
        try_files $blog_datei =404;
    }
}
